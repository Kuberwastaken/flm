[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flm"
version = "0.2.0"
description = "A connectome-constrained language-learning experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "requests>=2.31", "torch>=2.8"]

[project.optional-dependencies]
language = ["pyarrow==19.0.1", "tokenizers==0.22.2"]

[tool.setuptools.packages.find]
include = ["flm*"]
